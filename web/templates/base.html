{% load static %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}B站弹幕分析系统{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#FB7299; --color-on-primary:#FFFFFF; --color-secondary:#23ADE5;
  --color-accent:#F5C518; --color-background:#F7F8FA; --color-foreground:#FB7299;
  --color-muted:#FDE9EF; --color-muted-fg:#9499A0; --color-border:#F1F2F4; --color-destructive:#F87171;
  --font-sans:'Fira Sans','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-mono:'Fira Code','Consolas',monospace;
  --radius:14px;
  --shadow-sm:0 1px 2px rgba(251,114,153,.06);
  --shadow-md:0 1px 3px rgba(251,114,153,.06),0 8px 24px -12px rgba(251,114,153,.18);
  --grad-nav:linear-gradient(135deg,#F8487F 0%,#FB7299 55%,#FF9BB3 100%);
}
body{background:var(--color-background);color:#18191C;font-family:var(--font-sans);min-height:100vh;display:flex;flex-direction:column;padding-top:64px}
main{flex:1}
.svg-icon{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.navbar-app{background:var(--grad-nav)}
.navbar-app .navbar-brand{letter-spacing:.2px}
.nav-link-app{color:rgba(255,255,255,.9)!important;border-radius:8px;padding:.5rem .75rem;display:flex;align-items:center;gap:7px;font-size:.95rem;transition:background .18s ease,color .18s ease}
.nav-link-app:hover{color:#fff!important;background:rgba(255,255,255,.16)}
.nav-link-app.active{color:#fff!important;background:rgba(255,255,255,.22)}
.card-app{background:#fff;border:1px solid var(--color-border);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease}
.card-app:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.btn-app{display:inline-flex;align-items:center;gap:8px;border-radius:10px;font-weight:600;transition:transform .15s ease,box-shadow .2s ease,background .2s ease}
.btn-app:active{transform:scale(.97)}
.btn-app-primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;box-shadow:0 6px 16px -6px rgba(251,114,153,.5)}
.btn-app-primary:hover{background:#F8487F;border-color:#F8487F;color:#fff}
.btn-app-outline{background:#fff;border:1.5px solid var(--color-primary);color:var(--color-primary)}
.btn-app-outline:hover{background:var(--color-muted);color:var(--color-primary)}
.stat-num,.mono{font-family:var(--font-mono)}
.table-app{--bs-table-bg:transparent;border-collapse:separate;border-spacing:0 6px}
.table-app thead th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--color-muted-fg);border:none;padding:.4rem .75rem}
.table-app tbody tr{background:#fff;box-shadow:var(--shadow-sm);border-radius:10px;transition:box-shadow .18s ease,transform .18s ease}
.table-app tbody tr:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.table-app tbody td{border:none;padding:.7rem .75rem;vertical-align:middle}
.badge-score{font-family:var(--font-mono);font-weight:600;border-radius:8px;padding:.35em .6em}
.progress-app{height:10px;border-radius:999px;background:var(--color-muted)}
.progress-app .progress-bar{background:linear-gradient(90deg,#FB7299,#FF9BB3);border-radius:999px;transition:width .4s ease}
.empty-state{border:1.5px dashed var(--color-border);border-radius:var(--radius);background:#fff;padding:3rem 1.5rem;text-align:center;color:var(--color-muted-fg)}
footer{color:var(--color-muted-fg)}
:focus-visible{outline:3px solid var(--color-secondary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark navbar-app fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
      <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      B站弹幕分析
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="切换导航">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link nav-link-app" href="/danmaku/">
          <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>弹幕分析</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">
{% block content %}{% endblock %}
</main>
<footer class="text-center text-muted small py-3 border-top bg-white">
  B站弹幕分析系统 · 仅供个人学习使用 · 数据来自公开弹幕接口
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
